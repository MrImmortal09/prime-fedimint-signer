[package]
name = "fps-core"
description = "The phone wallet's Rust core for the iOS app: fps-mobile and fps-cashu in one library"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The static library the iOS app links: `scripts/ios-core-cashu.sh` builds it with
# `--crate-type staticlib` and fps-cashu's `uniffi` feature, and generates the Swift with
# fps-mobile's `uniffi-bindgen` (both crates use UniFFI 0.32.2). Being here also keeps fps-mobile's
# graph in `Cargo.lock` as `wallet/Cargo.lock` holds it.
[dependencies]
fps-mobile = { path = "../../wallet/fps-mobile" }
fps-cashu = { path = "../fps-cashu" }
