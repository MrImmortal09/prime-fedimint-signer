[package]
name = "fps-cashu"
description = "The phone's watch-only Cashu wallet, whose spends Passport Prime signs"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "fps_cashu"

[features]
# The UniFFI exports (namespace `fps_cashu`), which fps-core links into the iOS app beside
# fps-mobile's.
uniffi = ["dep:uniffi"]

# No fedimint: fps-core links this beside fps-mobile. Only the `cashu` types and CDK's
# `MintConnector` are used, pinned to one release; CDK's own wallet cannot spend SIG_ALL proofs.
# No CDK store (cdk-sqlite, cdk-redb) and no cdk-ffi: the store is a JSON file.
[dependencies]
async-trait = "0.1"
bitcoin = { version = "0.32", default-features = false, features = ["std", "rand-std"] }
cashu = { version = "=0.18.3", default-features = false, features = ["wallet"] }
cdk = { version = "=0.18.3", default-features = false, features = ["wallet"] }
fps-cashu-core = { path = "../../crates/cashu-core" }
fps-protocol = { path = "../../crates/protocol" }
fps-transport = { path = "../../crates/transport" }
hex = "0.4"
# For `cashu_install_tls`: aws-lc-rs, the provider fedimint installs, as the process default.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uniffi = { version = "0.32", features = ["tokio"], optional = true }

# The real Cashu service of the Prime app, in the test process, as Prime.
[dev-dependencies]
fps-cashu-signer = { path = "../../crates/cashu-signer" }
fps-signer = { path = "../../crates/signer" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
