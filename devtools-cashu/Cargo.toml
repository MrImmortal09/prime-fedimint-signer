[package]
name = "fps-devtools-cashu"
description = "Host tools: golden vectors and cross-checks of fps-cashu-core against the cashu crate"
version = "0.1.0"
edition = "2021"
publish = false

# Separate from the device workspace, and from devtools/: the `cashu` crate turns on bitcoin's
# `rand-std` and pulls getrandom 0.4, and it must not re-resolve the Fedimint generator's lockfile.
[workspace]

[dependencies]
fps-protocol = { path = "../crates/protocol" }
fps-cashu-core = { path = "../crates/cashu-core" }
fps-signer-core = { path = "../crates/signer-core" }
# The exact release the phone will use; vectors are produced with it.
cashu = { version = "=0.18.3", default-features = false, features = ["wallet", "mint"] }
bitcoin = "0.32"
lightning-invoice = "0.33"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
hex = "0.4"
