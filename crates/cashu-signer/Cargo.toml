[package]
name = "fps-cashu-signer"
description = "The Passport Prime Cashu service, and the Device that serves it beside the Fedimint signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Builds for the device like fps-signer: no network, no CDK, no getrandom, and no feature of its own
# on bitcoin or secp256k1 (CI job `curve-features`). It reaches the Fedimint signer through its
# public API only.
[dependencies]
fps-protocol = { path = "../protocol" }
fps-signer = { path = "../signer" }
fps-signer-core = { path = "../signer-core" }
fps-cashu-core = { path = "../cashu-core" }
fps-policy = { path = "../policy" }
ciborium.workspace = true
serde.workspace = true
zeroize = "1"

[dev-dependencies]
bitcoin.workspace = true
hex = "0.4"
lightning-invoice.workspace = true
serde_json = "1"
