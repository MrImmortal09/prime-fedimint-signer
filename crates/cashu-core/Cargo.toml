[package]
name = "fps-cashu-core"
description = "Checks and signs Cashu SIG_ALL swaps and melts for the Passport Prime signer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Builds for the device like fps-signer-core: no network, no CDK, no getrandom. The `cashu` crate
# checks it from the host workspace `devtools-cashu/`.
[dependencies]
fps-protocol = { path = "../protocol" }
# Read-only reuse: the review type, BOLT11 parsing and the error type.
fps-signer-core = { path = "../signer-core" }
bitcoin.workspace = true
zeroize = "1"

[dev-dependencies]
ciborium.workspace = true
lightning-invoice.workspace = true
serde.workspace = true
serde_json = "1"
hex = "0.4"
