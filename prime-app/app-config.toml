# Foundation application configuration
app-name = "fedimint-signer"
friendly-app-name = "Fedimint Signer"
launcher-app-name = "Fedimint"
description = "Reviews and signs Fedimint ecash transactions for your phone wallet"
icon = "resources/icon.svg"
theme = "resources/theme.json"
# Never change: KeyOS derives GetAppSeed, and so every key this app uses, from the app id.
app-id = "0xf73ee1e71ece205f0008ff41f7bc3cc4"
# Carries the pre-release suffix so every KeyOS 1.4.0 beta from beta2 on accepts the app: app-manager
# compares versions as semver, where "1.4.0-beta2" sorts below "1.4.0".
min-keyos-version = "1.4.0-beta2"

[publisher]
name = "Om Swami"
contact-email = "reach.oms2004@gmail.com"
support-url = "https://github.com/MrImmortal09/prime-fedimint-signer"

# The Launcher's QR scanner opens this app for the phone's signing requests.
[[qr-match-rules]]
id = "fps-request"
priority = 5
id-localizations = { en = "Fedimint signing request" }
sub-rules = { ur = { UR = { ur-type = "fps-request" } } }

[permissions]
template = ["gui-app", "fs-generic", "navigable"]
"os/security" = ["GetAppSeed"]
"os/settings" = ["GetDeviceName", "GetLocale", "GetPrimeColor"]
