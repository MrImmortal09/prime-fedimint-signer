[package]
name = "fedimint-signer"
version = "0.1.0"
edition = "2021"
publish = false

# Built by the Foundation SDK (`foundation build`, `foundation sim`), not as part of the repository
# workspace one directory up.
[workspace]
exclude = [".foundation-sdk"]

[dependencies]
log = "0.4"
log-server = { package = "xous-api-log", path = ".foundation-sdk/current/lib/keyos/xous/api/log" }
serde = { version = "1.0", features = ["derive"] }
server = { path = ".foundation-sdk/current/lib/keyos/server" }
slint-keyos-platform = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/runtime" }
foundation-themes = { path = ".foundation-sdk/current/lib/keyos/sdk/crates/foundation-themes" }
fs = { path = ".foundation-sdk/current/lib/keyos/api/fs" }
security = { path = ".foundation-sdk/current/lib/keyos/api/security" }

fps-cashu-signer = { path = "../crates/cashu-signer" }
fps-protocol = { path = "../crates/protocol" }
fps-policy = { path = "../crates/policy" }
fps-signer = { path = "../crates/signer" }
fps-signer-core = { path = "../crates/signer-core" }
fps-transport = { path = "../crates/transport" }

getrandom = "0.2"
zeroize = "1"

[build-dependencies]
slint-keyos-platform-build = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/build" }

# Randomness is pre-wired: add `getrandom = "0.2"` (or `rand = "0.8"`) and calls
# route to the TRNG on device. Stay on the getrandom 0.2 line; 0.3+ is uncovered.
[patch.crates-io]
getrandom = { path = ".foundation-sdk/current/lib/keyos/imports/getrandom" }

[profile.release]
# Cargo's default release stripping corrupts host proc-macro dylibs built with the SDK toolchain on
# current macOS; `foundation build` strips the device ELF itself. See docs/PHASES.md, Phase 1A.
strip = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(keyos)'] }
