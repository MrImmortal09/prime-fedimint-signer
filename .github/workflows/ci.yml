name: ci

on:
  push:
    branches: [main]
  pull_request:

# Host checks only. Device builds need Nix plus the Foundation SDK and run locally with
# scripts/device-build.sh; see docs/PHASES.md.
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The live cross-checks against the real fedimint 0.13.0-beta.1 crates, which build only on a
  # host with a C and C++ toolchain, CMake and libclang.
  fedimint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: devtools
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake
      - name: Golden vectors match what fedimint produces
        run: |
          cargo run --release --manifest-path devtools/Cargo.toml --bin golden
          git diff --exit-code crates/signer-core/tests/vectors
      - name: Device code cross-checked against fedimint
        run: cargo test --release --manifest-path devtools/Cargo.toml

  # The phone side, against fedimint with the patch series applied. fedimint's test fixtures run a
  # whole federation in the test process, and its LND client needs protoc to build.
  wallet:
    runs-on: ubuntu-latest
    env:
      # With full debug info, fedimint's test binaries fill the runner's disk and the linker dies
      # with a bus error. Line tables are enough for backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Free disk space
        # The runner's preinstalled SDKs leave too little room for fedimint's build.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallet
          # A cold build takes about an hour, so keep it even when a test fails.
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake protobuf-compiler
      - name: fedimint with the patch series
        run: scripts/fedimint-checkout.sh
      - run: cargo fmt --manifest-path wallet/Cargo.toml -p fps-wallet --check
      - name: The watch-only client against an in-process federation
        # From the wallet directory, so its cargo config gives fedimint's fixtures their test timings.
        working-directory: wallet
        run: cargo test

  # Cashu work happens beside the Fedimint code. Neither lockfile the Fedimint builds use may move:
  # a new normal dependency in a crate wallet/ uses by path would re-resolve wallet/Cargo.lock.
  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The root workspace resolves as locked
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: fedimint with the patch series
        run: scripts/fedimint-checkout.sh
      - name: The wallet workspace resolves as locked
        run: cargo metadata --locked --format-version 1 --manifest-path wallet/Cargo.toml > /dev/null

  # The Cashu signer core against the real `cashu` 0.18.3 crate, from its own host workspace, so
  # neither the Fedimint generator's lockfile nor the device graph sees CDK.
  cashu-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: devtools-cashu
      - name: Golden vectors match what the cashu crate produces
        run: |
          cargo run --release --locked --manifest-path devtools-cashu/Cargo.toml --bin golden
          git diff --exit-code crates/cashu-core/tests/vectors
      - name: Device code cross-checked against the cashu crate
        run: cargo test --release --locked --manifest-path devtools-cashu/Cargo.toml

  # Cargo unifies features across the app, so a feature a Cashu crate switched on for bitcoin or
  # secp256k1 would switch on for the Fedimint signer too (on the device, `rand-std` alone would
  # change its signing path). And getrandom has no backend on the device but the SDK's own.
  curve-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The Cashu signer adds no bitcoin or secp256k1 feature to the Fedimint signer's
        run: |
          # A step without `shell:` runs under `bash -e` alone: without pipefail a failing
          # `cargo tree` would leave an empty listing and pass.
          set -o pipefail
          features() {
            cargo tree --locked -e features,no-dev --target all --prefix none "$@" \
              | grep -E '^(bitcoin|secp256k1)[^ ]* feature "' \
              | sed 's/ (\*)$//' | LC_ALL=C sort -u
          }
          features -p fps-signer > "$RUNNER_TEMP/fedimint.txt"
          features -p fps-signer -p fps-cashu-signer > "$RUNNER_TEMP/both.txt"
          # Both listings are real ones: the Fedimint signer uses bitcoin with "std".
          grep -qx 'bitcoin feature "std"' "$RUNNER_TEMP/fedimint.txt"
          grep -qx 'bitcoin feature "std"' "$RUNNER_TEMP/both.txt"
          cat "$RUNNER_TEMP/both.txt"
          added=$(LC_ALL=C comm -13 "$RUNNER_TEMP/fedimint.txt" "$RUNNER_TEMP/both.txt")
          if [ -n "$added" ]; then
            echo "fps-cashu-signer switches on features fps-signer does not use:"
            echo "$added"
            exit 1
          fi
      - name: No getrandom in the Cashu signer's graph
        run: |
          if found=$(cargo tree --locked --target all -i getrandom -p fps-cashu-signer 2>&1); then
            echo "getrandom is in fps-cashu-signer's graph:"
            echo "$found"
            exit 1
          elif ! grep -q "did not match any packages" <<<"$found"; then
            echo "$found"
            exit 1
          fi
